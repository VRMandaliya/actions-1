name: My First Workflow

on: [push,fork]

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout Code
            uses: actions/checkout@v7
          - name: Directory Listing and File Content
            run:  
                  echo "Welcome to First run of Github Action Workflow"
                  ls -ltra
                  cat README.md
                  cat index.html
          - name: Generate ASCII artwork
            run:  cowsay -f dragon "Hello from GitHub Actions!" >> dragon.txt