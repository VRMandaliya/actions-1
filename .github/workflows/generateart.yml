name: Generate ASCII Artwork

on: [push,fork]

jobs:
    build_job_1:
        runs-on: ubuntu-latest
        steps:
          - name: Install cowsay and Generate ASCII artwork
            run:  |
                sudo apt-get install -y cowsay
                cowsay -f dragon "Hello from GitHub Actions! and you are dragon" >> dragon.txt  
          - name: upload artifact
            uses: actions/upload-artifact@v7
            with:
                name: dragon-artifact
                path: dragon.txt
    test_job_2:
        needs: build_job_1
        runs-on: ubuntu-latest
        steps:
          - name:  Download the artifact
            uses: actions/download-artifact@v7
            with:
                name: dragon-artifact
                path: .
          - name: test if file dragon.txt exists
            run:  |
                if [ -f dragon.txt ]; then
                    echo "File dragon.txt exists."
                else
                    echo "File dragon.txt does not exist."
                fi
    deploy_job_3:
        needs: [build_job_1, test_job_2]
        runs-on: ubuntu-latest
        steps:
          - name: Download the artifact
            uses: actions/download-artifact@v7
            with:
                name: dragon-artifact
                path: .
          - name: Read the ASCII artwork
            run:  |                
                cat dragon.txt
                echo "Reading the ASCII artwork from dragon.txt"