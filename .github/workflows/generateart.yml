name: Generate ASCII Artwork

on: [push,fork]

jobs:
    ascii_job:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v7
          - name: Directory Listing and File Content
            run:  ls -ltra
          - name: execute ascii.sh script
            run:  |
                chmod +x ascii.sh
                ./ascii.sh
            