name: Generate ASCII Artwork

on: [push,fork]

jobs:
    build_job_1:
        runs-on: ubuntu-latest
        steps:
          - name: Install cowsay and Generate ASCII artwork
            run:  |
                sudo apt-get install -y cowsay
                cowsay -f dragon "Hello from GitHub Actions! and you are dragon" >> dragon.txt  
          - name: Sleep for 10 seconds
            run:  sleep 10     
    test_job_2:
        needs: build_job_1
        runs-on: ubuntu-latest
        steps:
          - name:  Sleep for 10 seconds
            run:  sleep 10
          - name: test if file dragon.txt exists
            run:  |
                if [ -f dragon.txt ]; then
                    echo "File dragon.txt exists."
                else
                    echo "File dragon.txt does not exist."
                fi
    deploy_job_3:
        needs: [build_job_1, test_job_2]
        runs-on: ubuntu-latest
        steps:
          - name: Sleep for 10 seconds
            run:  sleep 10
          - name: Deploy the ASCII artwork
            run:  echo "Deploying the ASCII artwork from dragon.txt"