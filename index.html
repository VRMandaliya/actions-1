<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample HTML Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }
        header, main, footer {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Sample Page</h1>
        <p>This is a basic HTML5 boilerplate template.</p>
    </header>

    <main>
        <h2>Common Elements</h2>
        <p>Here is a paragraph with <strong>bold</strong> and <em>italic</em> text.</p>
        
        <ul>
            <li>List item one</li>
            <li>List item two</li>
            <li>List item three</li>
        </ul>

        <p>Visit <a href="https://example.com" target="_blank">Example.com</a> to learn more.</p>

        <button onclick="alert('Hello! Your HTML file is working.')">Click Me</button>
    </main>

    <footer>
        <p>&copy; 2026 Sample Website</p>
    </footer>

</body>
</html>
